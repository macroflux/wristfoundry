name: Draft release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build draft release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate semantic version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag like v0.1.0; received $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build development firmware with ESP-IDF 5.5.5
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: .
          command: >-
            idf.py build &&
            python -m pip install --disable-pip-version-check esp-idf-sbom==1.5.0 &&
            esp-idf-sbom create --format cyclonedx-json@1.6 --vex-format none
            --output-file build/wristfoundry.cdx.json build/project_description.json

      - name: Assemble release bundle
        # Packaging is blocked unless versioned changelog notes are finalized.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bootloader dist/partition_table
          cp build/bootloader/bootloader.bin dist/bootloader/bootloader.bin
          cp build/partition_table/partition-table.bin dist/partition_table/partition-table.bin
          cp build/wristfoundry.bin dist/wristfoundry.bin
          cp build/flash_args dist/flash_args
          python scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md SECURITY.md CHANGELOG.md dist/
          cp docs/INSTALL.md dist/INSTALL.md
          cp docs/RECOVERY.md dist/RECOVERY.md
          cp build/wristfoundry.cdx.json dist/
          (cd dist && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -C dist -czf "wristfoundry-${GITHUB_REF_NAME}.tar.gz" .

      - name: Upload release bundle to workflow run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wristfoundry-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            wristfoundry-${{ github.ref_name }}.tar.gz
            dist/SHA256SUMS

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "WristFoundry $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "wristfoundry-${GITHUB_REF_NAME}.tar.gz" \
            dist/SHA256SUMS

  windows-companion:
    name: Attach matching Windows companion to draft
    needs: release
    runs-on: windows-2022
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true
      - name: Verify and build companion
        working-directory: companion/desktop
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --fatal-infos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --reporter expanded --timeout 90s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ../../scripts/Package-Companion.ps1
      - name: Attach complete runtime and separate checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = 'companion/desktop/build/packages'
          Copy-Item "$package/SHA256SUMS" "$package/COMPANION-SHA256SUMS"
          gh release upload $env:GITHUB_REF_NAME "$package/wristfoundry-companion-windows-x64.zip" "$package/COMPANION-SHA256SUMS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
