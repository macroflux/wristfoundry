name: Companion
on:
  push:
    branches: [main]
    paths: ['companion/**', 'protocol/**', 'tests/**', '.github/workflows/companion.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true
      - run: python scripts/prepare_android.py
      - name: Use JDK 17
        run: |
          test -d "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - run: flutter pub get && flutter analyze --fatal-infos && flutter test --reporter expanded --timeout 90s
        working-directory: companion/desktop
      - run: flutter build apk --debug
        working-directory: companion/desktop
      - name: Package test APK and checksums
        run: |
          mkdir -p artifacts/android
          cp companion/desktop/build/app/outputs/flutter-apk/app-debug.apk artifacts/android/wristfoundry-companion-android-debug.apk
          (cd artifacts/android && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wristfoundry-companion-android-debug-${{ github.sha }}
          path: artifacts/android/*
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python -m pip install jsonschema==4.25.1
      - run: python -m unittest discover -s tests -p '*_test.py' -v
      - run: cc -std=c11 -Wall -Wextra -Werror tests/companion_frame_test.c -o /tmp/companion-frame-test && /tmp/companion-frame-test
      - run: cc -std=c11 -Wall -Wextra -Werror -Itests/stubs tests/settings_service_test.c main/settings_service.c -o /tmp/settings-service-test && /tmp/settings-service-test
      - run: cc -std=c11 -Wall -Wextra -Werror tests/phone_policy_test.c -o /tmp/phone-policy-test && /tmp/phone-policy-test
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: companion/desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --reporter expanded --timeout 90s
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: companion-ui-review-${{ github.sha }}
          path: |
            companion/desktop/review-captures/*.png
            companion/desktop/lib/*.dart
            companion/desktop/test/*.dart
            companion/desktop/pubspec.lock
          if-no-files-found: warn
      - run: flutter build windows --release
        id: release
        if: ${{ !cancelled() }}
      - run: ./../../scripts/Package-Companion.ps1
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        with:
          name: wristfoundry-companion-windows-${{ github.sha }}
          path: companion/desktop/build/packages/*
          if-no-files-found: error
