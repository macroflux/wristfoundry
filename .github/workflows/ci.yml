name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-safety:
    name: Public safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject generated or private material
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(build[^/]*|managed_components|backups)(/|$)|(^|/)sdkconfig$|\.(bin|elf|map|pem|key|nvs|dump)$'; then
            echo 'Generated, secret, or device material is tracked.' >&2
            exit 1
          fi
          if git grep -n -i -E 'CommandWatch|CWIFI|phone[ _-]?time|VICKY|NEXUS|C:\\Users|BEGIN .*PRIVATE KEY' -- . ':(exclude).github/workflows/ci.yml'; then
            echo 'Private-upstream identifier or secret material detected.' >&2
            exit 1
          fi

  build-development:
    name: Development firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build with ESP-IDF 5.5.5
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: .
          command: >-
            idf.py build &&
            python -m pip install --disable-pip-version-check esp-idf-sbom==1.5.0 &&
            esp-idf-sbom create --format cyclonedx-json@1.6 --vex-format none
            --output-file build/wristfoundry.cdx.json build/project_description.json

      - name: Assert development security configuration
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '^#define CONFIG_NVS_ENCRYPTION 1$' build/config/sdkconfig.h
          grep -q '^#define CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH 1$' build/config/sdkconfig.h

      - name: Record checksums
        shell: bash
        run: |
          mkdir -p artifacts/development
          sha256sum \
            build/bootloader/bootloader.bin \
            build/partition_table/partition-table.bin \
            build/wristfoundry.bin > artifacts/development/SHA256SUMS

      - name: Upload development firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wristfoundry-development-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/wristfoundry.bin
            build/flash_args
            artifacts/development/SHA256SUMS
            build/wristfoundry.cdx.json

  build-secure:
    name: Encrypted-NVS firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build isolated secure profile with ESP-IDF 5.5.5
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: .
          command: >-
            idf.py -B build-secure
            -DSDKCONFIG=build-secure/sdkconfig
            -DSDKCONFIG_DEFAULTS=sdkconfig.defaults\;sdkconfig.secure.defaults
            build

      - name: Assert encrypted-NVS configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^#define CONFIG_NVS_ENCRYPTION 1$' build-secure/config/sdkconfig.h
          grep -q '^#define CONFIG_NVS_SEC_KEY_PROTECT_USING_HMAC 1$' build-secure/config/sdkconfig.h
          grep -q '^#define CONFIG_NVS_SEC_HMAC_EFUSE_KEY_ID 0$' build-secure/config/sdkconfig.h
          grep -q '^#define CONFIG_ESP_COREDUMP_ENABLE_TO_NONE 1$' build-secure/config/sdkconfig.h
          ! grep -q '^#define CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH 1$' build-secure/config/sdkconfig.h

      - name: Record checksums
        shell: bash
        run: |
          mkdir -p artifacts/secure
          sha256sum \
            build-secure/bootloader/bootloader.bin \
            build-secure/partition_table/partition-table.bin \
            build-secure/wristfoundry.bin > artifacts/secure/SHA256SUMS

      - name: Upload secure-profile firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wristfoundry-secure-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            build-secure/bootloader/bootloader.bin
            build-secure/partition_table/partition-table.bin
            build-secure/wristfoundry.bin
            build-secure/flash_args
            artifacts/secure/SHA256SUMS
